# GitHub Pages 배포(SPEC §12): main에 푸시하면 테스트·빌드 후 Pages에 올린다.
# 저장소 Settings → Pages → Source를 "GitHub Actions"로 바꿔야 동작한다.
# 공유 미리보기 이미지가 SNS에서 보이게 하려면 저장소 Variables에 SITE_URL(끝에 / 포함)을 넣는다.
name: deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - run: npm run build
        env:
          VITE_SITE_URL: ${{ vars.SITE_URL || './' }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

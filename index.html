<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>카트에서 챔피언까지 · 레이싱 커리어 시뮬레이션</title>
    <meta name="description" content="12세 카트 유망주에서 F1 월드 챔피언까지. 훈련, 이적, 계약, 라이브 레이스로 만드는 무료 레이싱 커리어 시뮬레이션(비공식 팬 게임)." />
    <meta name="theme-color" content="#09090b" />
    <link rel="icon" type="image/svg+xml" href="%VITE_SITE_URL%favicon.svg" />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="ko_KR" />
    <meta property="og:title" content="카트에서 챔피언까지" />
    <meta property="og:description" content="12세 카트 유망주에서 F1 월드 챔피언까지. 무료 레이싱 커리어 시뮬레이션(비공식 팬 게임)." />
    <meta property="og:image" content="%VITE_SITE_URL%og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <script>
      // 개발 주소: http://cart-to-champion/ . 예전 주소에서 옮겨 온 저장 파일(#migrate=)을 받아 둔다. 배포 주소에는 영향 없음
      (function () {
        var KEY = 'kart-to-champion-save', NAMED = 'cart-to-champion';
        try {
          var h = location.hostname;
          if ((h === 'localhost' || h === '127.0.0.1') && (location.port === '' || location.port === '80')) {
            var save = localStorage.getItem(KEY);
            location.replace('http://' + NAMED + '/' + (save ? '#migrate=' + encodeURIComponent(save) : ''));
            return;
          }
          if (h === NAMED && location.hash.indexOf('#migrate=') === 0) {
            var data = decodeURIComponent(location.hash.slice(9));
            if (!localStorage.getItem(KEY)) localStorage.setItem(KEY, data);
            history.replaceState(null, '', location.pathname + location.search);
          }
        } catch (e) { /* 저장소를 못 쓰는 환경: 그냥 진행 */ }
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Nanum+Pen+Script&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/app/main.tsx"></script>
  </body>
</html>
